<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Warm sienna background tile so the favicon reads on any tab colour. -->
  <rect width="512" height="512" rx="112" fill="#b8613a"/>
  <!-- Compass ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#faf5ec" stroke-width="16"/>
  <!-- North/south vertical needle -->
  <path d="M256 80 L300 256 L256 432 L212 256 Z" fill="#faf5ec"/>
  <!-- East/west horizontal indicator -->
  <path d="M80 256 L256 220 L432 256 L256 292 Z" fill="#faf5ec" opacity="0.55"/>
  <!-- Centre dot -->
  <circle cx="256" cy="256" r="24" fill="#b8613a"/>
  <circle cx="256" cy="256" r="10" fill="#faf5ec"/>
</svg>
